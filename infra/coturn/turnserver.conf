# coturn for PrivateCall WebRTC. Ephemeral creds (TURN REST API) — secret = TURN_SECRET in app env.
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=CHANGE_ME_TURN_SECRET
realm=voice.example.com
# external-ip=PUBLIC_IP/PRIVATE_IP   (set by setup script on NAT'd clouds like Oracle)
min-port=49160
max-port=49200
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1
# Do not relay to private/internal networks
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
total-quota=100
user-quota=4
