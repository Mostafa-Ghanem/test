; PrivateCall — PJSIP. Provider-independent: the upstream trunk is generated into
; pjsip_provider.conf (endpoint name is always "provider-trunk").
; Replace voice.example.com / EXTERNAL_IP via setup-voice-server.sh.

[global]
type=global
user_agent=PrivateCall
; Never let inbound requests set caller ID for outbound legs
endpoint_identifier_order=ip,username

; ---------- Transports ----------
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0
external_media_address=EXTERNAL_IP
external_signaling_address=EXTERNAL_IP
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=EXTERNAL_IP
external_signaling_address=EXTERNAL_IP
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
external_media_address=EXTERNAL_IP
external_signaling_address=EXTERNAL_IP

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/fullchain.pem
priv_key_file=/etc/asterisk/keys/privkey.pem
method=tlsv1_2
external_media_address=EXTERNAL_IP
external_signaling_address=EXTERNAL_IP

; ---------- WebRTC templates (users generated into pjsip_users.conf) ----------
[webrtc-endpoint](!)
type=endpoint
transport=transport-wss
context=from-webrtc
disallow=all
allow=opus,ulaw,alaw
webrtc=yes                 ; = DTLS-SRTP + ICE + AVPF + rtcp_mux
dtls_auto_generate_cert=yes
dtls_verify=fingerprint
dtls_setup=actpass
media_encryption=dtls
ice_support=yes
use_avpf=yes
rtcp_mux=yes
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
; Browser can NEVER influence outbound caller identity
trust_id_inbound=no
send_pai=no
max_audio_streams=1

[webrtc-auth](!)
type=auth
auth_type=userpass

[webrtc-aor](!)
type=aor
max_contacts=3
remove_existing=yes
qualify_frequency=30

#tryinclude pjsip_users.conf
#tryinclude pjsip_provider.conf
