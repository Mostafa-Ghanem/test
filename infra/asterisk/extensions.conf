; PrivateCall dialplan. Provider-independent: all routing decisions come from the app.
; Env (from /etc/default/privatecall or container env):
;   PRIVATECALL_APP_URL   e.g. https://privatecall.vercel.app
;   VOICE_SHARED_SECRET   same as app

[general]
static=yes
writeprotect=yes

[globals]

; ---------- Browser (WebRTC) -> PSTN ----------
; The browser can only dial an opaque one-time token "pc<32 hex>" obtained from POST /api/calls.
; The app authorizes (user, limits, destination) and returns the destination + identity.
[from-webrtc]
exten => _pc.,1,NoOp(PrivateCall outbound from ${CHANNEL(endpoint)})
 ; Only "pc" + 32 lowercase hex is accepted (prevents query-string injection via the dialed user part)
 same => n,GotoIf($[${REGEX("^pc[0-9a-f]{32}$" ${EXTEN})} = 0]?deny)
 same => n,Set(CURLOPT(httpheader)=X-Voice-Secret: ${ENV(VOICE_SHARED_SECRET)})
 same => n,Set(CURLOPT(conntimeout)=3)
 same => n,Set(CURLOPT(httptimeout)=5)
 same => n,Set(AUTH=${CURL(${ENV(PRIVATECALL_APP_URL)}/api/voice/authorize?endpoint=${CHANNEL(endpoint)}&token=${EXTEN:2})})
 same => n,GotoIf($["${CUT(AUTH,|,1)}" != "OK"]?deny)
 same => n,Set(CALL_ID=${CUT(AUTH,|,2)})
 same => n,Set(DIALNUM=${CUT(AUTH,|,3)})
 same => n,Set(PRIV=${CUT(AUTH,|,4)})
 same => n,Set(MAXSEC=${CUT(AUTH,|,6)})
 same => n,GotoIf($["${PRIV}" != "1"]?deny)
 same => n,GotoIf($[${REGEX("^[0-9]+$" ${MAXSEC})} = 0]?deny)
 same => n,Set(CHANNEL(hangup_handler_push)=pc-hangup,s,1(${CALL_ID}))
 ; Identity: fixed account number from app config (never from the browser) ...
 same => n,Set(CALLERID(all)="" <${CUT(AUTH,|,5)}>)
 ; ... hidden with CLIR: From=Anonymous, PAI=account number, "Privacy: id" (RFC 3325)
 same => n,Set(CALLERID(pres)=prohib)
 same => n,Dial(PJSIP/${DIALNUM}@provider-trunk,60,S(${MAXSEC}))   ; S(): hard cap after answer (daily-minute limit)
 same => n,Hangup()
 same => n(deny),NoOp(Denied: ${AUTH})
 same => n,Hangup(21)

exten => _X.,1,Hangup(21)   ; anything else is rejected
exten => _+X.,1,Hangup(21)

; ---------- CDR -> app (idempotent on UNIQUEID) ----------
[pc-hangup]
exten => s,1,Set(CURLOPT(httpheader)=X-Voice-Secret: ${ENV(VOICE_SHARED_SECRET)})
 same => n,Set(CURLOPT(httptimeout)=5)
 same => n,Set(R=${CURL(${ENV(PRIVATECALL_APP_URL)}/api/voice/cdr,callId=${ARG1}&uniqueId=${UNIQUEID}&disposition=${IF($["${DIALSTATUS}" = ""]?FAILED:${DIALSTATUS})}&billsec=${CDR(billsec)}&duration=${CDR(duration)}&start=${CDR(start,u)}&answer=${CDR(answer,u)}&end=${EPOCH})})
 same => n,Return()

; ---------- Inbound from provider: not supported in MVP ----------
[from-provider]
exten => _X.,1,Hangup(21)
exten => _+X.,1,Hangup(21)
